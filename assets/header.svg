<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>

    <!-- Radial Ambient Glows -->
    <radialGradient id="glowCyan" cx="15%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowIndigo" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowBlue" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .title { font-weight: 800; font-size: 40px; fill: url(#textGrad); letter-spacing: -0.5px; }
    .subtitle { font-weight: 400; font-size: 16px; fill: #94A3B8; letter-spacing: 0.2px; }
    .tag-text { font-size: 11px; font-weight: 600; fill: #38BDF8; letter-spacing: 1.5px; text-transform: uppercase; }
  </style>

  <!-- Card Background -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)"/>
  <rect width="900" height="240" rx="16" fill="url(#glowCyan)"/>
  <rect width="900" height="240" rx="16" fill="url(#glowIndigo)"/>
  <rect width="900" height="240" rx="16" fill="url(#glowBlue)"/>

  <!-- Subtle Inner Grid -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="60" x2="900" y2="60"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="180" x2="900" y2="180"/>
    <line x1="180" y1="0" x2="180" y2="240"/>
    <line x1="360" y1="0" x2="360" y2="240"/>
    <line x1="540" y1="0" x2="540" y2="240"/>
    <line x1="720" y1="0" x2="720" y2="240"/>
  </g>

  <!-- Border -->
  <rect width="898" height="238" x="1" y="1" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Left Accent Bar -->
  <rect x="0" y="45" width="4" height="150" rx="2" fill="url(#accentGrad)"/>

  <!-- Status Pill -->
  <g transform="translate(48, 38)">
    <rect width="190" height="28" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#00E5FF"/>
    <text x="28" y="18" class="mono tag-text">Mobile Engineer</text>
  </g>

  <!-- Main Name -->
  <text x="48" y="112" class="sans title">Erick Tarantino</text>

  <!-- Subtitle -->
  <text x="48" y="142" class="sans subtitle">Building scalable mobile apps, elegant cross-platform interfaces &amp; robust architectures.</text>

  <!-- Key Highlight Pills / Tags -->
  <g transform="translate(48, 172)">
    <!-- Flutter Chip -->
    <g transform="translate(0, 0)">
      <rect width="95" height="28" rx="6" fill="#0E1E2E" stroke="#0284C7" stroke-width="1" stroke-opacity="0.4"/>
      <text x="47" y="18" class="mono" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">⚡ FLUTTER</text>
    </g>
    <!-- Dart Chip -->
    <g transform="translate(105, 0)">
      <rect width="80" height="28" rx="6" fill="#0E1E2E" stroke="#0284C7" stroke-width="1" stroke-opacity="0.4"/>
      <text x="40" y="18" class="mono" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">🎯 DART</text>
    </g>
    <!-- Android Chip -->
    <g transform="translate(195, 0)">
      <rect width="105" height="28" rx="6" fill="#0F241A" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>
      <text x="52" y="18" class="mono" font-size="11" font-weight="600" fill="#34D399" text-anchor="middle">🤖 ANDROID</text>
    </g>
    <!-- Clean Arch Chip -->
    <g transform="translate(310, 0)">
      <rect width="170" height="28" rx="6" fill="#18132B" stroke="#818CF8" stroke-width="1" stroke-opacity="0.4"/>
      <text x="85" y="18" class="mono" font-size="11" font-weight="600" fill="#A5B4FC" text-anchor="middle">🏗️ CLEAN ARCHITECTURE</text>
    </g>
  </g>

  <!-- Right Decorative Icon / Badge -->
  <g transform="translate(740, 50)" opacity="0.9">
    <rect width="110" height="140" rx="12" fill="#0A0F1D" stroke="#1E293B" stroke-width="1"/>
    <!-- Code Bracket Icon -->
    <path d="M 40 45 L 25 65 L 40 85" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 70 45 L 85 65 L 70 85" fill="none" stroke="#818CF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="60" y1="42" x2="50" y2="88" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    
    <text x="55" y="112" class="mono" font-size="10" font-weight="600" fill="#94A3B8" text-anchor="middle">INDONESIA</text>
    <text x="55" y="126" class="sans" font-size="9" fill="#64748B" text-anchor="middle">Open to Work</text>
  </g>
</svg>
